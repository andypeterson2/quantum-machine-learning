version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # requirements.txt is the Intel-Mac parity lock: PyTorch's last x86_64-macOS
    # wheels are torch 2.2.2 / torchvision 0.17.2, and torch 2.2 needs numpy<2
    # (which in turn caps pennylane below 0.45). Bumps past that ceiling cannot
    # install on the dev machine, and a lone torch or torchvision bump cannot
    # resolve at all, so those pins move by hand, together, when dev leaves Intel.
    ignore:
      - dependency-name: torch
      - dependency-name: torchvision
      - dependency-name: numpy
        update-types: ["version-update:semver-major"]
      - dependency-name: pennylane
        versions: [">=0.45"]
      # ruff's enforced rule set moves with its minors: 0.16 stabilises
      # PLR0917, which three deliberate call sites would have to waive, and
      # those waivers are RUF100 errors under 0.15 — so no tree is clean under
      # both. Patch bumps are fine; a minor is a deliberate, paired change to
      # this range and the lint job's.
      - dependency-name: ruff
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
  # The linux/production lock, which the image installs from. Separate from the
  # Intel-Mac parity file above so production can move while dev stays capped.
  - package-ecosystem: pip
    directory: /requirements/linux
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # torch.txt carries these, from PyTorch's CPU index, and they move as a
      # pair by hand — a lone bump of either cannot resolve.
      - dependency-name: torch
      - dependency-name: torchvision

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
