services:
  classifier:
    container_name: classifier
    build: .
    ports:
      # gunicorn binds ${PORT:-8080} inside the container (see the Dockerfile
      # CMD) — the container side is fixed at 8080; only the published host
      # port is configurable.
      - "127.0.0.1:${CLASSIFIERS_PORT:-8080}:8080"
    # No environment overrides: CORS origins come from the server's own
    # anchored default. A "localhost:*" entry is an unanchored
    # flask-cors regex that also admits http://localhostevil.com, so any
    # CLASSIFIERS_CORS_ORIGINS override must use ^...$-anchored patterns.
