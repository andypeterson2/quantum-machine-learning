[project]
name = "quantum-machine-learning"
version = "0.2.0"
description = "Multi-dataset classifier platform comparing classical and quantum-hybrid neural networks"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Andy Peterson"},
]
keywords = [
    "quantum-computing",
    "machine-learning",
    "pytorch",
    "flask",
    "mnist",
    "neural-networks",
]

dependencies = [
    "flask>=3.0",
    "flask-cors>=6.0",
    "torch>=2.2",
    "torchvision>=0.17",
    "numpy>=1.26,<2",  # torch 2.2 uses numpy's 1.x C-API; numpy 2 breaks it
    "Pillow>=12.0",
    "mistune>=3.0",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
quantum = [
    "qiskit>=1.0",
    "qiskit-aer>=0.13",
    "pennylane>=0.35,<0.45",  # 0.45+ requires numpy>=2, which breaks torch 2.2
]
dev = [
    "pytest>=8.0",
    # Compatible-release pin: the enforced rule set shifts with ruff minors, so
    # CI must not float across them.
    "ruff~=0.15.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Complexity budgets (C90/PLR) + rewrite-to-shorter families (SIM/RET/C4/PIE/
# PERF/FURB/PTH) on top of the correctness floor. Deliberately excluded as
# noise for this codebase: D, ANN, EM, FBT, COM, Q.
select = [
  "E", "W", "F", "I",             # correctness + style + imports
  "N", "UP", "B", "A",            # naming, modernize, bugbear, builtin-shadowing
  "S", "T20",                     # security, stray prints
  "C90", "PLR", "PLW", "PLE",     # complexity budgets: mccabe + pylint
  "SIM", "RET", "RSE", "PIE", "C4",  # simplify, returns, comprehensions
  "PERF", "FURB", "PTH",          # perf anti-patterns, modern idioms, pathlib
  "ARG", "ISC", "TID", "TRY", "RUF",
]
ignore = [
  "TRY003",   # long exception messages — verbosity pedantry
  "PLR2004",  # magic-value comparisons — noisy outside tests
  "RUF001", "RUF002", "RUF003",  # typographic chars in prose/output are intentional
  "PERF203",  # try/except in loop — flags legitimate per-item error isolation
  "N812",     # `import torch.nn.functional as F` is the canonical torch idiom
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S110", "S310", "PLR0913", "ARG", "T201", "N806"]
# Dataset plugins follow ML naming conventions (X / X_train feature matrices),
# use asserts as tensor-shape invariants in data prep, and declare class-level
# config dicts.
"classifiers/datasets/**" = ["N806", "S101", "RUF012"]
# The executed notebook keeps its cells as-run: prints are its output medium,
# and compact exploratory idioms (semicolons, long lines, asserts as inline
# sanity checks, notebook-scope imports) are the genre. Re-linting them would
# force a full re-execution for zero reader benefit.
"*.ipynb" = ["T201", "E702", "E501", "S101", "I001", "RET505", "N816", "N802", "E731", "E402", "B905", "FURB", "PLR"]
